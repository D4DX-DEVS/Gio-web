packages:
  - apps/*
  - packages/*
  - tools/*

# Supply-chain guard: do not resolve versions published in the last 14 days
# (value in minutes).
minimumReleaseAge: 20160
# Exempt only where a security release must not wait (see
# docs/architecture/PHASE_1_SPIKE_RESULTS.md, "Versions"):
#   next <= 16.4.0 has critical advisories (GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr)
#   react / react-dom 19.3.1 is the React Server Components transport fix of 14 Oct 2026
minimumReleaseAgeExclude:
  - next
  - '@next/*'
  - eslint-config-next
  - react
  - react-dom
  - scheduler
  # @opennextjs/cloudflare 1.20.12 is the first release supporting Next.js 16.4
  # (changelog #1453); 1.20.13 needs @opennextjs/aws 4.1.12.
  - "@opennextjs/cloudflare"
  - "@opennextjs/aws"

# Packages allowed to run install scripts. Everything else is blocked.
onlyBuiltDependencies:
  - esbuild
  - workerd
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Flat node_modules without symlinks. Needed on Windows: the OpenNext build
# copies Next's standalone output and fails with EPERM on symlink() unless
# Developer Mode is on (see PHASE_1_SPIKE_RESULTS.md, "Windows").
nodeLinker: hoisted

# One postcss copy. next pins 8.5.23 and sanitize-html needs ^8.5.27; two copies make
# Turbopack emit a symlinked alias (.next/node_modules/postcss-<hash>) for this
# server-external package, which the OpenNext build cannot copy on Windows (EPERM).
overrides:
  postcss: 8.5.30
